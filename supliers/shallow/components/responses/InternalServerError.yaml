description: Internal Server Error - The server encountered an unexpected condition that prevented it from fulfilling the request.
content:
  application/json:
    schema:
      type: object
      required:
        - header
      properties:
        header:
          type: object
          required:
            - resultCode
            - resultMessage
          properties:
            resultCode:
              type: string
              description: Error code
            resultMessage:
              type: string
              description: Error message