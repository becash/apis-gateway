type: object
description: Supplier balance query response (AES-encrypted in `body` when `resultCode` is `0000`)
required:
  - header
  - body
properties:
  header:
    $ref: './CommonResponseHeader.yaml'
  body:
    type: object
    description: response body (AES-encrypted)
    required:
      - vendorId
    properties:
      vendorId:
        type: string
        description: Vendor ID returned in the response
        example: "VEND12345"
      prepaidAccountBalance:
        type: number
        description: Current prepaid account balance (if the supplier has a prepaid account)
        example: 1000.00
      prepaidAccountBalanceCurrency:
        type: string
        description: Currency of prepaid balance (ISO code)
        example: "CNY"
      creditAccountBalance:
        type: number
        description: Current credit account balance (if the supplier has a credit account)
        example: 5000.00
      creditAccountBalanceCurrency:
        type: string
        description: Currency of credit balance (ISO code)
        example: "CNY"
