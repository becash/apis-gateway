type: object
description: Request payload for order cancellation confirmation (AES-encrypted; see Data-Exchange-And-Security)
required:
  - header
  - body
properties:
  header:
    $ref: './CommonRequestHeader.yaml'
  body:
    type: object
    description: request body (AES-encrypted)
    required:
      - sequenceId
      - otaOrderId
      - supplierOrderId
      - confirmResultCode
      - confirmResultMessage
      - items
    properties:
      sequenceId:
        type: string
        description: Supplier’s Batch Number (`yyyyMMdd` + GUID)
        example: "20250507A1B2C3D4E5F6G7H8"
      otaOrderId:
        type: string
        description: Channel order number
        example: "OTA1234567890"
      supplierOrderId:
        type: string
        description: Supplier order number
        example: "SUP0987654321"
      confirmResultCode:
        type: string
        description: >
          Confirmation return code.  
          See: The return code of Channel's interface (`0000` = success).
        example: "0000"
      confirmResultMessage:
        type: string
        description: Confirmation result information or failure reason
        example: "Cancellation accepted"
      items:
        type: array
        description: Order line item node
        items:
          type: object
          required:
            - itemId
          properties:
            itemId:
              type: string
              description: Order line item number
              example: "LI123456"
            vouchers:
              type: array
              description: |
                Canceled voucher node (required if a voucher was issued).  
                Note: if the order was consumed, vouchers cannot be reused.
              items:
                type: object
                required:
                  - voucherId
                properties:
                  voucherId:
                    type: string
                    description: Voucher number
                    example: "VCH123456"
