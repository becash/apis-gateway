# components/schemas/ItineraryEnd.yaml
type: object
description: End trip information for an itinerary segment
required:
  - endTime
  - endType
  - location
properties:
  endTime:
    type: string
    pattern: "^\\d{2}:\\d{2}$"
    description: End time in 24-hour format (HH:mm)
    example: "18:00"
  endType:
    type: string
    enum:
      - End_on_the_Spot
      - End_After_Return
      - Drop_Off_Everyone
    description: |
      How the trip ends:
      - End_on_the_Spot: Trip ends at the spot  
      - End_After_Return: Trip ends after return to start  
      - Drop_Off_Everyone: Supplier drops off all guests
    example: End_After_Return
  location:
    type: array
    description: One or more end‐point locations
    items:
      $ref: './ProductPoi.yaml'
    maxItems: 20
