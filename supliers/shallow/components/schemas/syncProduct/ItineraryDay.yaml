# components/schemas/ItineraryDay.yaml
type: object
description: Itinerary details for a single day
required:
  - items
properties:
  dayNumber:
    type: integer
    description: Day index (1–9)
    example: 1
  items:
    type: array
    description: Activity list for the day
    items:
      $ref: './ItineraryActivity.yaml'
    maxItems: 20
