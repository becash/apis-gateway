# components/schemas/RedemptionInfo.yaml
type: object
description: Ticket redemption information
required:
  - redemptionType
  - redemptionLocation
properties:
  redemptionType:
    type: string
    enum:
      - Direct_Entry
      - Need_Ticket_Exchange
      - Meet_at_Start_Point
      - Pick_Up_Everyone
    description: Redemption type
  redemptionLocation:
    type: array
    description: One or more redemption locations
    items:
      type: object
      oneOf:
        - type: object
          required:
            - supplierLocation
          properties:
            supplierLocation:
              type: object
              required:
                - supplierId
                - mappingElements
              properties:
                supplierId:
                  type: string
                  maxLength: 200
                  example: "LOC_5001"
                mappingElements:
                  type: object
                  required:
                    - name
                    - addressDetail
                    - latitude
                    - longitude
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    addressDetail:
                      type: string
                      maxLength: 100
                    latitude:
                      type: number
                      format: float
                    longitude:
                      type: number
                      format: float
        - type: object
          required:
            - googlePlaceId
          properties:
            googlePlaceId:
              type: string
              example: "ChIJLfySpTOuEmsRsc_JfJtljdc"
  description:
    type: string
    maxLength: 400
    description: Additional redemption instructions
