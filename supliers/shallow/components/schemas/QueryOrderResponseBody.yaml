type: object
required:
  - otaOrderId
  - supplierOrderId
  - items
properties:
  otaOrderId:
    type: string
    description: Channel order number.
    example: "T202408180001"
  supplierOrderId:
    type: string
    description: Supplier order number.
    example: "S-778899"
  items:
    type: array
    minItems: 1
    items:
      $ref: './QueryOrderItem.yaml'
