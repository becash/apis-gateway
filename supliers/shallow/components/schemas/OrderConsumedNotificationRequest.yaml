type: object
description: Request payload for order consumed notification (AES-encrypted in `body`; see Data-Exchange-And-Security)
required:
  - header
  - body
properties:
  header:
    $ref: './CommonRequestHeader.yaml'
  body:
    type: object
    description: request body (This field requires AES encryption during transmission)
    required:
      - sequenceId
      - otaOrderId
      - supplierOrderId
      - items
    properties:
      sequenceId:
        type: string
        description: GGT batch number (`yyyyMMdd` + GUID without separators)
        example: "20250507A1B2C3D4E5F6G7H8"
      otaOrderId:
        type: string
        description: Channel's order number
        example: "OTA1234567890"
      supplierOrderId:
        type: string
        description: GGT order number
        example: "SUP0987654321"
      items:
        type: array
        description: Array of order-line consumption nodes
        items:
          type: object
          required:
            - itemId
          properties:
            itemId:
              type: string
              description: Order line item number
              example: "LI123456"
            useStartDate:
              type: string
              format: date
              description: Actual valid date (`yyyy-MM-dd`)
              example: "2025-06-15"
            useEndDate:
              type: string
              format: date
              description: Actual expiry date (`yyyy-MM-dd`) (same as start if one-day)
              example: "2025-06-15"
            quantity:
              type: integer
              description: Total number of orders
              example: 3
            useQuantity:
              type: integer
              description: Total number of orders that have been consumed (required if consumed)
              example: 2
            passengers:
              type: array
              description: |
                Passengers corresponding to consumed orders (one per person).  
                Required if `useQuantity` > 0.
              items:
                type: object
                required:
                  - passengerId
                properties:
                  passengerId:
                    type: string
                    description: Passenger number
                    example: "P1"
            vouchers:
              type: array
              description: |
                Consumed voucher nodes (required if vouchers were used).  
                If a voucher is consumed multiple times, report only the last consumption.
              items:
                type: object
                required:
                  - voucherId
                properties:
                  voucherId:
                    type: string
                    description: Voucher number
                    example: "VCH123456"
            remark:
              type: string
              description: Remark information
            discount:
              type: object
              description: Preferential information node
              properties:
                policyList:
                  type: array
                  description: Station-day discount policy list
                  items:
                    type: object
                    required:
                      - date
                      - quantity
                    properties:
                      date:
                        type: string
                        format: date
                        description: Offer date (`yyyy-MM-dd`)
                        example: "2025-06-15"
                      quantity:
                        type: integer
                        description: Preferential quantity
                        example: 1
            lostAmount:
              type: number
              description: Actual amount of loss
              example: 10.50
            lostAmountCurrency:
              type: string
              description: Currency of loss amount (ISO code, e.g. `CNY`)
              example: "CNY"
