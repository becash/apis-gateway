# components/schemas/BookingQuestions.yaml
type: object
description: A single booking-question that customer answers once
properties:
  code:
    type: string
    maxLength: 200
    description: Supplier’s question code
  name:
    type: string
    maxLength: 50
    description: Human-readable question
  answerType:
    type: string
    enum:
      - Single_Selection
      - Free_Text
    description: Type of answer expected
  allowedAnswers:
    $ref: './AllowedAnswers.yaml'
  description:
    type: string
    description: Hint or help text for this question
required:
  - code
  - name
  - answerType
additionalProperties: false
