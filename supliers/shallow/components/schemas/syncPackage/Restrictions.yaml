# components/schemas/Restrictions.yaml
type: object
description: Booking/unit restrictions for one product unit
properties:
  minUnits:
    type: string
    description: Minimum booking quantity per order
  maxUnits:
    type: string
    description: Maximum booking quantity per order
  unitPax:
    type: string
    description: Number of people this unit covers (e.g. 1 for single, 4 for family)
  companionRequired:
    type: string
    enum:
      - Not_Required
      - Required
    description: >
      Whether this unit can be booked alone (Not_Required) or must accompany another.
required:
  - minUnits
  - maxUnits
  - unitPax
  - companionRequired
additionalProperties: false
