# components/schemas/PackageOption.yaml
type: object
description: A single selectable option variant in a package
properties:
  optionCode:
    type: string
    description: |
      One of: `Option`, `Time_Slot`.  
      This code must be configured first in your sync-product endpoint.
  valueCode:
    type: string
    maxLength: 40
    description: Option value code
  valueName:
    type: string
    maxLength: 40
    description: |
      Human-readable option name.  
      Must match the primary language.
required:
  - optionCode
  - valueCode
  - valueName
additionalProperties: false
