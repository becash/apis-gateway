# components/schemas/Currency.yaml
type: object
description: ISO currency codes for this unit’s pricing
properties:
  netPriceCurrency:
    type: string
    description: Currency of the net (supplier) price (ISO 4217)
  retailPriceCurrency:
    type: string
    description: Currency of the retail (customer) price (ISO 4217)
required:
  - netPriceCurrency
  - retailPriceCurrency
additionalProperties: false
