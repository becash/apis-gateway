type: object
description: Request payload for pre-order creation (AES-encrypted at transport)
required:
  - header
  - body
properties:
  header:
    $ref: './CommonRequestHeader.yaml'
  body:
    type: object
    description: request body (This field requires AES encryption during transmission)
    required:
      - sequenceId
      - otaOrderId
      - contacts
      - items
    properties:
      sequenceId:
        type: string
        description: Channel's Batch Number yyyyMMdd + 32-bit GUID
        example: "20250507A1B2C3D4E5F6G7H8"
      otaOrderId:
        type: string
        description: Channel order number
        example: "OTA1234567890"
      contacts:
        type: array
        description: Array of contact objects
        items:
          type: object
          required:
            - name
            - mobile
            - intlCode
          properties:
            name:
              type: string
              description: Contact name
              example: "Michal Scott"
            mobile:
              type: string
              description: Phone number
              example: "13800000000"
            intlCode:
              type: string
              description: International dialing code
              example: "91"
            optionalMobile:
              type: string
              description: Alternate phone number
            optionalIntlCode:
              type: string
              description: Intl code for alternate number
            email:
              type: string
              description: Email address
              example: "user@example.com"
      items:
        type: array
        description: Array of order line items
        items:
          type: object
          required:
            - PLU
            - locale
            - useStartDate
            - useEndDate
            - price
            - priceCurrency
            - salePrice
            - salePriceCurrency
            - quantity
            - distributionChannel
          properties:
            PLU:
              type: string
              description: Supplier product unit
              example: "PLU12345"
            locale:
              type: string
              description: Language-region code
              example: "en-US"
            distributionChannel:
              type: string
              description: Sales channel code (Assigned by GGT)
              example: "Channel_name"
            useStartDate:
              type: string
              format: date
              description: Start date (`yyyy-MM-dd`)
              example: "2025-06-15"
            useEndDate:
              type: string
              format: date
              description: >-
                Expiry date (`yyyy-MM-dd`),  
                same as useStartDate if one-day
              example: "2025-06-15"
            remark:
              type: string
              description: Remark information
              example: "Window seat requested"
            price:
              type: number
              description: Customer Payment amount per unit
              example: 150.00
            priceCurrency:
              type: string
              description: Payment currency (ISO code)
              example: "KRW"
            salePrice:
              type: number
              description: Sale price per unit (The original unit sale price of the supplier's product uploaded to
                in channels during the product upload)
              example: 180.00
            salePriceCurrency:
              type: string
              description: Sale price currency (ISO code)
              example: "KRW"
            quantity:
              type: integer
              description: Quantity of this item
              example: 2
            passengers:
              type: array
              description: Array of traveler objects
              items:
                type: object
                required:
                  - passengerId
                properties:
                  passengerId:
                    type: string
                    description: Passenger identifier
                    example: "P1"
                  name:
                    type: string
                    description: Full name
                    example: "Michal Scott"
                  firstName:
                    type: string
                    description: Given name in Pinyin/English
                    example: "San"
                  lastName:
                    type: string
                    description: Surname in Pinyin/English
                    example: "Zhang"
                  mobile:
                    type: string
                    description: Phone number
                    example: "13800000000"
                  intlCode:
                    type: string
                    description: International dialing code
                    example: "91"
                  cardType:
                    type: string
                    description: Document type code
                    example: "ID"
                  cardNo:
                    type: string
                    description: Document number
                    example: "123456789012345678"
                  birthDate:
                    type: string
                    format: date
                    description: Date of birth (`yyyy-MM-dd`)
                    example: "1985-10-20"
                  ageType:
                    type: string
                    description: Age category (ADU/CHI/BAB)
                    example: "ADU"
                  gender:
                    type: string
                    description: Gender (M/F)
                    example: "M"
                  nationalityCode:
                    type: string
                    description: Nationality ISO code
                    example: "CN"
                  nationalityName:
                    type: string
                    description: Nationality name
                    example: "China"
                  cardIssueCountry:
                    type: string
                    description: Country issuing document
                    example: "CN"
                  cardIssuePlace:
                    type: string
                    description: Issue place
                    example: "Beijing"
                  cardIssueDate:
                    type: string
                    format: date
                    description: Document issue date
                    example: "2000-01-01"
                  cardValidDate:
                    type: string
                    format: date
                    description: Document expiry date
                    example: "2030-01-01"
                  cardIssueNumber:
                    type: integer
                    description: Issuance number
                    example: 1
                  birthPlace:
                    type: string
                    description: Place of birth
                    example: "Shanghai"
                  height:
                    type: number
                    description: Height in cm
                    example: 170
                  weight:
                    type: number
                    description: Weight in kg
                    example: 65
                  myopiaDegreeL:
                    type: number
                    description: Left-eye myopia degree
                    example: 0
                  myopiaDegreeR:
                    type: number
                    description: Right-eye myopia degree
                    example: 0
                  shoeSize:
                    type: number
                    description: European shoe size
                    example: 42
      adjunctions:
        type: array
        description: Additional attribute nodes
        items:
          type: object
          required:
            - name
            - content
          properties:
            name:
              type: string
              description: Attribute name
              example: "SpecialRequest"
            nameCode:
              type: string
              description: Attribute code
              example: "REQ01"
            content:
              type: string
              description: Content value
              example: "Vegetarian meal"
            contentCode:
              type: string
              description: Content code
              example: "ENC01"
      deposit:
        type: object
        description: Deposit/Margin info
        required:
          - type
          - amount
          - amountCurrency
        properties:
          type:
            type: integer
            description: Deposit type (1=web prepaid; 2=scenic pay)
            example: 1
          amount:
            type: number
            description: Deposit amount
            example: 50.0
          amountCurrency:
            type: string
            description: Deposit currency
            example: "CNY"
      expressDelivery:
        type: object
        description: Delivery information
        required:
          - type
        properties:
          type:
            type: string
            description: Delivery type (1=pickup; 2=delivery)
            example: "1"
          name:
            type: string
            description: Recipient name
            example: "张三"
          mobile:
            type: string
            description: Phone number
            example: "13800000000"
          intlCode:
            type: string
            description: International dialing code
            example: "86"
          country:
            type: string
            description: Country
            example: "China"
          province:
            type: string
            description: Province/State
            example: "Beijing"
          city:
            type: string
            description: City
            example: "Beijing"
          district:
            type: string
            description: District
            example: "Chaoyang"
          address:
            type: string
            description: Street address
            example: "No.1 Park Road"