type: object
description: Standard GGT request header
required:
  - accountId
  - serviceName
  - requestTime
  - version
  - sign
properties:
  accountId:
    type: string
    description: Channel's account, provided by GGT
    example: "CHANNEL_ID"
  serviceName:
    type: string
    description: Interface Name, one of CreatePreOrder, PayPreOrder, PayPreOrderConfirm, CancelPreOrder, CancelOrder,
      CancelOrderConfirm, OrderConsumedNotice, QueryOrder, QueryProduct, SupplierBalanceQuery based on APIs. For 
      ResourcePriceSync 
      API - DatePriceModify, For ResourceInventorySync API - DateInventoryModify
    example: "CreatePreOrder"
  requestTime:
    type: string
    format: date-time
    description: Request timestamp in `yyyy-MM-dd HH:mm:ss` format
    example: "2025-05-07 14:23:59"
  version:
    type: string
    description: API version - 1.0
    example: "1.0"
  sign:
    type: string
    description: Signature string for payload integrity, see signature algorithm
    example: "abcdef1234567890"
