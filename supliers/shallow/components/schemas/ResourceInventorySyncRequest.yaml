type: object
description: Request payload for resource inventory synchronization (AES-encrypted; see Data-Exchange-And-Security)
required:
  - header
  - body
properties:
  header:
    $ref: './CommonRequestHeader.yaml'
  body:
    type: object
    description: request body (AES-encrypted)
    required:
      - sequenceId
      - dateType
      - inventories
    properties:
      sequenceId:
        type: string
        description: GGT batch number (`yyyyMMdd`+GUID)
        example: "20250507A1B2C3D4E5F6G7H8"
      otaOptionId:
        type: integer
        description: Channel resource ID (omit if `supplierOptionId` provided)
        example: 12345
      supplierOptionId:
        type: string
        description: Supplier’s PLU (omit if `otaOptionId` provided)
        example: "PLU98765"
      dateType:
        type: string
        description: |-
          Date type:
          - `DATE_REQUIRED`: Dated products (date required, up to 90 days)
          - `DATE_NOT_REQUIRED`: Open-date products (no date)
        enum:
          - DATE_REQUIRED
          - DATE_NOT_REQUIRED
        example: DATE_REQUIRED
      inventories:
        type: array
        description: Array of inventory nodes (saleable quantity per date)
        items:
          type: object
          required:
            - quantity
          properties:
            date:
              type: string
              format: date
              description: |-
                Date (`yyyy-MM-dd`).  
                Only when `dateType=DATE_REQUIRED`.  
                Up to 90 days per request.
              example: "2025-06-15"
            quantity:
              type: integer
              description: Saleable inventory
              example: 50
