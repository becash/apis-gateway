type: object
required:
  - itemId
  - useStartDate
  - useEndDate
  - orderStatus
  - quantity
  - useQuantity
  - cancelQuantity
properties:
  itemId:
    type: string
    description: Order line item number. If pre-order exists but not paid, use "0".
    example: "1"
  useStartDate:
    type: string
    format: date
    description: Actual valid start date (yyyy-MM-dd).
    example: "2025-08-18"
  useEndDate:
    type: string
    format: date
    description: Actual valid end date (yyyy-MM-dd). If single-day, equals useStartDate.
    example: "2025-08-20"
  orderStatus:
    type: integer
    description: Order status
  quantity:
    type: integer
    minimum: 0
    description: Total number of orders.
    example: 2
  useQuantity:
    type: integer
    minimum: 0
    description: Total number of orders actually used.
    example: 1
  cancelQuantity:
    type: integer
    minimum: 0
    description: Total number of orders actually canceled.
    example: 0
  passengers:
    type: array
    description: >
      Required when cancelType=2 (all passengers are included in the cancellation).
    items:
      $ref: './QueryOrderPassenger.yaml'
  vouchers:
    type: array
    description: Voucher node; transmit all voucher information.
    items:
      $ref: './QueryOrderVoucher.yaml'
