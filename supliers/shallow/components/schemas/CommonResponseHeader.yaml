type: object
description: Standard GGT response header
required:
  - resultCode
  - resultMessage
properties:
  resultCode:
    type: string
    description: >
      The return code of processing results.
    example: "0000"
  resultMessage:
    type: string
    description: >
      The return information of processing results.  
      If failed, explains the specific reason.
    example: "Success"
