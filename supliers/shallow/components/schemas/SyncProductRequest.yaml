type: object
description: >
  Payload to create or update a product on Channel (AES-encrypted, see Data-Exchange-And-Security).
required:
    - supplierProductId
    - reference
    - contractId
    - primaryLanguage
    - status
    - category
    - tags
    - title
    - poi
    - destination
    - departure
    - ticketInfo
    - redemptionInfo
    - serviceLanguage
    - gallery
    - inclusions
    - exclusions
    - highlight
    - description
    - howToUse
    - additionalInfo
    - duration
    - itinerary
    - rawDescription
    - guestInformation
    - bookingSettings
    - paymentConfirmationTime
    - cancellationPolicy
    - ticketType
properties:
  supplierProductId:
    type: string
    maxLength: 40
    description: The supplier product id.
  reference:
    type: string
    description: Optional supplier identifier.
  contractId:
    type: integer
    description: Contract ID between supplier and channel
  primaryLanguage:
    type: string
    enum: [zh-CN, zh-HK, en-US, ko-KR, ja-JP, th-TH]
    description: >
      Language code of the primary product content.
  status:
    type: string
    enum: [active, inactive]
    description: Product status (active=valid, inactive=not valid).
  category:
    type: array
    items:
      $ref: './syncProduct/ProductCategory.yaml'
  tags:
    type: array
    items:
      $ref: './syncProduct/ProductTag.yaml'
  title:
    type: string
    maxLength: 100
    description: Supplier product name.
  poi:
    type: array
    items:
      $ref: './syncProduct/ProductPoi.yaml'
  ticketInfo:
    $ref: './syncProduct/TicketInfo.yaml'
  redemptionInfo:
    $ref: './syncProduct/RedemptionInfo.yaml'
  serviceLanguage:
    type: array
    items:
      $ref: './syncProduct/ServiceLanguage.yaml'
  gallery:
    type: array
    items:
      $ref: './syncProduct/ProductImage.yaml'
    maxItems: 20
  inclusions:
    type: array
    items:
      type: string
      maxLength: 500
    maxItems: 20
    description: Free-text fees included.
  exclusions:
    type: array
    items:
      type: string
      maxLength: 500
    maxItems: 20
    description: Free-text fees excluded.
  highlight:
    type: array
    items:
      type: string
      maxLength: 200
    maxItems: 3
  description:
    type: string
    maxLength: 8000
    description: Rich-text product description.
  howToUse:
    type: array
    items:
      type: string
      maxLength: 4000
    maxItems: 20
  additionalInfo:
    type: string
    maxLength: 4000
  duration:
    $ref: './syncProduct/TravelDuration.yaml'
  itinerary:
    type: array
    items:
      $ref: './syncProduct/Itinerary.yaml'
    maxItems: 1

  rawDescription:
      type: string
      maxLength: 8000
      description: |
        Unstructured free-text itinerary description. Required when `itinerary` is not provided
        for Day-tour category products.

  guestInformation:
      $ref: './syncProduct/GuestInformation.yaml'

  bookingSettings:
      $ref: './syncProduct/BookingSettings.yaml'

  paymentConfirmationTime:
      type: integer
      enum: [ 5, 10, 15, 30, 40, 60, 120 ]
      description: |
        Minutes allowed for customer to complete payment after order creation.

  cancellationPolicy:
      $ref: './syncProduct/CancellationPolicy.yaml'

  ticketType:
      type: array
      description: Ticket type information per product unit.
      maxItems: 10
      items:
        $ref: './syncProduct/TicketType.yaml'

  option:
      type: array
      description: |
        Option objects when product requires option or time slot selection.
      maxItems: 4
      items:
        $ref: './syncProduct/ProductOption.yaml'

  metaData:
      type: string
      maxLength: 8000
      description: Extended information in JSON or free text
